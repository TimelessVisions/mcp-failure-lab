      roles:
      - server
      - fixture
      requires_tools:
      - echo
      requires_transport_features: {}
      requires_safe_tool_invocation: false
    severity: high
    expected_outcome: HTTP 400 with JSON-RPC error code -32020. The minimiser should strip the preceding
      steps, the unused body fields and the reducible header, while preserving the Mcp-Method mismatch
      that causes the failure.
    normative_source: "MCP 2026-07-28 schema.json: HeaderMismatchError, code = -32020 \u2014 'For HTTP,\
      \ the response status code MUST be 400 Bad Request.'"
    security_category: header_body_authorization_split
    security_limitations:
    - The same defect as the minimal variant, wrapped in reducible noise. It exists to exercise minimisation
      and establishes nothing further about any implementation.
