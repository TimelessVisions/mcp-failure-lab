scenario:
  definition:
    scenario_id: version.http_header_body_mismatch_noisy
    version: '1'
    title: Header/body mismatch surrounded by reducible noise
    category: version_header
    nature: security_relevant
    purpose: Demonstrate that automatic reduction works over HTTP when reducible material exists, without
      overstating the already-minimal variant.
    applicability:
      min_spec_version: '2026-07-28'
      profiles:
      - mcp-2026-07-28
      transports:
