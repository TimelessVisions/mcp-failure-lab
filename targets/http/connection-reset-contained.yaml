target_id: http.fixture.connection_reset.contained
role: fixture
implementation: "interop-lab HTTP fixture (defect: reset_connection), contained"
language: python
version: "0.1.0"
launch_command: ["${PYTHON}", "fixtures/http_server.py"]
env:
  INTEROP_FIXTURE_PROFILE: "2026-07-28"
  INTEROP_FIXTURE_DEFECTS: "reset_connection"
  INTEROP_FIXTURE_PORT: "8000"
  # Safe only inside an --internal network with no published port: the probe
  # sidecar is the only client that can reach it.
  INTEROP_FIXTURE_BIND: "0.0.0.0"

transport: streamable_http
protocol_profile: mcp-2026-07-28
timeout_s: 30.0
expected_tools: [echo]

# This fixture aborts every POST without responding, including `initialize`, so
# capability discovery can never succeed against it — by construction, not by
# accident. It exists to prove the harness detects a reset, and blocking that on
# a handshake it deliberately refuses would delete the coverage it provides.
#
# Permitted here only because this is a local fixture whose defect this
# repository wrote. The model refuses this flag outright on any external target.
allow_declared_tool_fallback: true

provenance: local_fixture
execution_mode: container
container:
  image_source:
    # Pulled from a registry, so the repository digest is the identity and
    # nothing has to be built. The tag is informational; the digest resolves.
    kind: registry
    repository: "mirror.gcr.io/library/python"
    repository_digest: "sha256:229a2c5bfa27522db7815ea81f9bed70af17ccb9de9fc7ad142b1877b5830d36"
    display_tag: "3.12-slim"
  network: isolated_sidecar
  container_port: 8000
  memory_mb: 256
  cpus: 0.5
  pids_limit: 64
  read_only_root: true
  user: "65534:65534"
  repo_mounts: ["fixtures"]
  startup_timeout_s: 60.0

notes: >-
  DELIBERATELY DEFECTIVE local fixture, contained. Resets the connection without
  responding, so the probe records a transport error rather than a hang.
  Synthetic; never a third-party defect.
